[package]
name = "snf-server"
version = "0.1.0"
edition = "2021"
# oldest Rust this builds with (e.g. Debian 12's packaged cargo). Cargo.lock pins dependency
# versions that support it, so build with --locked. Re-lock with:
#   CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo update
rust-version = "1.75"
description = "Small, fast static file server for the portfolio site"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "compression-br", "compression-gzip", "set-header"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
